<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VaultForge — SeedForge .vlk</title>
<style>
  :root{ --bg:#080b12; --panel:#0f1626; --edge:#1d2a44; --fg:#e6edf3; --sub:#8892a6;
         --cyan:#22d3ee; --green:#34d399; --mag:#ff2e88; --entry:#0b1220; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:radial-gradient(120% 80% at 50% -10%, #10203a 0%, var(--bg) 60%);
        color:var(--fg); font-family:-apple-system,Segoe UI,Roboto,system-ui,sans-serif; min-height:100vh; }
  header{ padding:18px 16px 10px; }
  header h1{ margin:0; font-size:18px; letter-spacing:.5px; }
  header h1 b{ color:var(--cyan); }
  header p{ margin:4px 0 0; color:var(--sub); font-size:11px; }
  .tabs{ display:flex; gap:6px; padding:8px 12px 0; overflow-x:auto; }
  .tab{ flex:0 0 auto; background:var(--panel); color:var(--sub); border:1px solid var(--edge);
        border-bottom:none; border-radius:10px 10px 0 0; padding:10px 14px; font-size:13px; cursor:pointer; }
  .tab.active{ color:var(--cyan); background:#10192b; border-color:var(--cyan); }
  main{ padding:14px 12px 30px; }
  .panel{ display:none; background:var(--panel); border:1px solid var(--edge); border-radius:0 12px 12px 12px; padding:16px; }
  .panel.active{ display:block; }
  label{ display:block; font-size:12px; color:var(--sub); margin:12px 0 5px; }
  label:first-child{ margin-top:0; }
  textarea,input[type=text],input[type=password]{ width:100%; background:var(--entry); color:var(--fg);
        border:1px solid var(--edge); border-radius:9px; padding:11px; font-size:15px; font-family:ui-monospace,Menlo,Consolas,monospace; }
  textarea{ resize:vertical; }
  input:focus,textarea:focus{ outline:none; border-color:var(--cyan); }
  .row{ display:flex; gap:10px; }
  .row > div{ flex:1; }
  .num{ max-width:90px; }
  button.act{ width:100%; margin-top:16px; background:linear-gradient(135deg,var(--cyan),#0ea5b7);
        color:#04121a; border:none; border-radius:10px; padding:14px; font-size:15px; font-weight:700; cursor:pointer; }
  button.ghost{ background:transparent; color:var(--cyan); border:1px solid var(--cyan);
        border-radius:10px; padding:12px; font-size:14px; cursor:pointer; margin-top:10px; }
  input[type=file]{ width:100%; color:var(--sub); font-size:13px; margin-top:4px; }
  .status{ margin-top:12px; font-size:12px; min-height:16px; word-break:break-word; }
  pre{ background:var(--entry); border:1px solid var(--edge); border-radius:9px; padding:12px;
        font-size:12px; white-space:pre-wrap; word-break:break-word; margin:6px 0 0; color:var(--fg); }
  .out{ font-size:13px; }
  hr{ border:none; border-top:1px solid var(--edge); margin:18px 0; }
  .foot{ text-align:center; color:var(--sub); font-size:10px; padding:6px 16px 20px; }
</style>
</head>
<body>
  <header>
    <h1>Vault<b>Forge</b></h1>
    <p>SeedForge <b>.vlk</b> vault · Argon2id + XChaCha20-Poly1305 · 100% offline</p>
  </header>

  <div class="tabs">
    <div class="tab active" data-target="p-create">Create</div>
    <div class="tab" data-target="p-open">Open</div>
    <div class="tab" data-target="p-inspect">Inspect</div>
    <div class="tab" data-target="p-shamir">Shamir</div>
  </div>

  <main>
    <section id="p-create" class="panel active">
      <label>Seed phrase (BIP-39 words)</label>
      <textarea id="c-seed" rows="3" autocomplete="off" autocapitalize="none" spellcheck="false"></textarea>
      <label>Note (optional · stored in vault · not secret)</label>
      <input id="c-note" type="text" autocomplete="off">
      <div class="row">
        <div><label>Password</label><input id="c-pw" type="password" autocomplete="new-password"></div>
        <div><label>Confirm</label><input id="c-pw2" type="password" autocomplete="new-password"></div>
      </div>
      <button id="c-btn" class="act">Create .vlk → Downloads</button>
      <div id="c-status" class="status"></div>
    </section>

    <section id="p-open" class="panel">
      <label>Vault file (.vlk)</label>
      <input id="o-file" type="file" accept=".vlk,application/octet-stream,*/*">
      <label>Password</label>
      <input id="o-pw" type="password" autocomplete="off">
      <button id="o-btn" class="act">Open vault</button>
      <div id="o-meta" class="status"></div>
      <label>Recovered seed phrase</label>
      <textarea id="o-out" class="out" rows="3" readonly></textarea>
      <button id="o-copy" class="ghost">Copy seed</button>
    </section>

    <section id="p-inspect" class="panel">
      <label>Vault file (.vlk) — header only, no password</label>
      <input id="i-file" type="file" accept=".vlk,application/octet-stream,*/*">
      <button id="i-btn" class="act">Inspect</button>
      <pre id="i-out">—</pre>
    </section>

    <section id="p-shamir" class="panel">
      <label>Split: seed phrase → shares</label>
      <textarea id="s-seed" rows="3" autocomplete="off" autocapitalize="none" spellcheck="false"></textarea>
      <div class="row">
        <div class="num"><label>threshold k</label><input id="s-k" type="text" value="2"></div>
        <div class="num"><label>shares n</label><input id="s-n" type="text" value="3"></div>
      </div>
      <button id="s-split" class="act">Split</button>
      <div id="s-status" class="status"></div>
      <textarea id="s-out" class="out" rows="4" readonly></textarea>
      <hr>
      <label>Combine: paste k shares (one per line) → seed phrase</label>
      <textarea id="cm-in" rows="4" autocomplete="off" autocapitalize="none" spellcheck="false"></textarea>
      <button id="cm-btn" class="act">Combine</button>
      <div id="cm-status" class="status"></div>
      <textarea id="cm-out" class="out" rows="3" readonly></textarea>
    </section>
  </main>

  <div class="foot">VaultForge · same VLK1 format as the SeedForge CLI &amp; Windows GUI · works with no signal</div>
